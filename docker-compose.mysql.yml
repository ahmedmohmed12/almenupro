services:
  mysql:
    image: mysql:8.0
    container_name: almenupro-mysql
    restart: unless-stopped
    ports:
      - "3307:3306"
    environment:
      MYSQL_DATABASE: almenupro
      MYSQL_USER: almenupro
      MYSQL_PASSWORD: almenupro
      MYSQL_ROOT_PASSWORD: almenupro
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
